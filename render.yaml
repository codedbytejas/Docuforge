services:
  - type: web
    name: docuforge-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: TRUSTED_PROXY
        value: "true"
      - key: RL_ENABLED
        value: "true"
      - key: RL_GENERATIONS_PER_HOUR
        value: "5"
      - key: RL_GENERATIONS_PER_DAY
        value: "15"
      - key: RL_REGENERATIONS_PER_HOUR
        value: "15"
      - key: RL_MAX_CONCURRENT_JOBS_PER_USER
        value: "1"
      - key: RL_GLOBAL_REQUESTS_PER_MINUTE
        value: "15"
      - key: RL_GLOBAL_DAILY_REQUESTS
        value: "1500"
      - key: RL_MAX_INPUT_CHARS
        value: "150000"
      - key: RL_UPLOADS_PER_MINUTE
        value: "10"
